# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact test dependencies
        run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Check source and contracts
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          mypy src
          python scripts/verify_contracts.py
      - name: Run conformance suite
        run: pytest --cov-report=xml

  real-storage:
    name: Real PostgreSQL and S3 Artifact acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install '.[s3]' meridian-storage-postgresql==1.0.0 pytest==9.0.3 pytest-cov==6.2.1
      - name: Start disposable real engines
        run: docker compose -p meridian-artifact-acceptance -f tests/real_storage/compose.yaml up -d --wait
      - name: First publication, exact reads, and discovery rejection
        run: pytest tests/real_storage --no-cov --junitxml=real-storage.xml
      - name: Stop only the test engines
        if: always()
        run: docker compose -p meridian-artifact-acceptance -f tests/real_storage/compose.yaml down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: real-storage-acceptance
          path: real-storage.xml
          if-no-files-found: error

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - run: bandit -r src -c pyproject.toml
      - run: pip-audit --skip-editable

  package:
    name: Reproducible package
    needs: [quality, security, real-storage]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787875200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Build twice
        run: |
          python -m build --no-isolation --outdir .artifacts/first
          python -m build --no-isolation --outdir .artifacts/second
      - name: Verify distributions and generate SBOM
        run: |
          twine check .artifacts/first/*
          python scripts/verify_artifacts.py .artifacts/first
          python scripts/compare_artifacts.py .artifacts/first .artifacts/second
          mkdir .artifacts/release
          cp .artifacts/first/* .artifacts/release/
          python scripts/generate_sbom.py --output .artifacts/release/meridian-plugin-config-artifact-1.0.3.spdx.json .artifacts/first/*
          cd .artifacts/release && sha256sum meridian_plugin_config_artifact-* > SHA256SUMS
      - name: Verify v1.0.3 release evidence
        run: python scripts/verify_release_evidence.py evidence/v1.0.3.json .artifacts/release
      - name: Verify immutable v1.0.2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .artifacts/released-v102
          gh release download v1.0.2 --dir .artifacts/released-v102
          python scripts/verify_release_evidence.py evidence/v1.0.2.json .artifacts/released-v102
      - name: Verify immutable v1.0.1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .artifacts/released-v101
          gh release download v1.0.1 --dir .artifacts/released-v101
          python scripts/verify_release_evidence.py evidence/v1.0.1.json .artifacts/released-v101
      - name: Verify immutable legacy v1.0.0 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir .artifacts/released-v100
          gh release download v1.0.0 --dir .artifacts/released-v100
          python scripts/verify_release_evidence.py evidence/v1.0.0.json .artifacts/released-v100
      - name: Clean-install wheel with released predecessors
        run: |
          python -m venv .artifacts/venv
          WHEEL_PATH=$(find .artifacts/first -name '*.whl' -type f -print -quit)
          .artifacts/venv/bin/python -m pip install --disable-pip-version-check "$WHEEL_PATH"
          cd /tmp
          "$GITHUB_WORKSPACE/.artifacts/venv/bin/python" -I -c 'from importlib.metadata import entry_points; plugins={x.name:x for x in entry_points(group="meridian_storage.plugins")}; schemas={x.name:x for x in entry_points(group="meridian_storage.schemas")}; assert plugins["config-artifact"].load()().plugin_id == "config-artifact"; assert schemas["config-artifact"].load()().provider_id == "meridian.plugin.config-artifact"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-plugin-config-artifact-${{ github.sha }}
          path: .artifacts/release/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
