[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-plugin-config-artifact"
version = "1.0.0"
description = "Meridian V1 configuration and artifact publication and consumption plugin"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Meridian contributors"}]
keywords = ["meridian", "configuration", "artifact", "object-storage", "metadata"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "meridian-storage-core==1.0.0",
  "meridian-storage-object-common==1.0.0",
  "meridian-storage-query==1.0.0",
  "meridian-storage-semantics==1.0.0",
]

[project.optional-dependencies]
s3 = ["meridian-storage-s3==1.0.0"]
oci = ["meridian-storage-oci==1.0.0"]
test = [
  "bandit[toml]==1.8.6",
  "build==1.3.0",
  "hatchling==1.27.0",
  "hypothesis==6.138.15",
  "jsonschema==4.25.1",
  "meridian-storage-oci==1.0.0",
  "meridian-storage-s3==1.0.0",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
  "twine==7.0.0",
]

[project.urls]
Documentation = "https://github.com/zephytiju/meridian-plugin-config-artifact#readme"
Issues = "https://github.com/zephytiju/meridian-plugin-config-artifact/issues"
Repository = "https://github.com/zephytiju/meridian-plugin-config-artifact"

[project.entry-points."meridian_storage.plugins"]
config-artifact = "meridian_storage.plugins.config_artifact.plugin:ConfigArtifactPluginFactory"

[project.entry-points."meridian_storage.schemas"]
config-artifact = "meridian_storage.plugins.config_artifact.schemas:ConfigArtifactSchemaProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "meridian_storage/plugins/config_artifact/contracts"
"compatibility.json" = "meridian_storage/plugins/config_artifact/compatibility.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/contracts",
  "/docs",
  "/scripts",
  "/.github",
  "/compatibility.json",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=meridian_storage.plugins.config_artifact --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "contract: released-contract compatibility tests",
  "integration: multi-distribution integration tests",
  "packaging: distribution and archive tests",
  "property: generative deterministic tests",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage.plugins.config_artifact"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"scripts/**/*.py" = ["T201"]
"src/meridian_storage/plugins/config_artifact/errors.py" = ["N818"]
"src/meridian_storage/plugins/config_artifact/models/resources.py" = ["PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_storage.plugins.config_artifact"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
