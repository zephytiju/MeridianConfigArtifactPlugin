services:
  database:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    platform: linux/amd64
    ports: ["127.0.0.1:55441:5432"]
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian-fixture-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U meridian -d meridian"]
      interval: 2s
      timeout: 2s
      retries: 30
  objects:
    image: bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    command: server /bitnami/minio/data
    ports: ["127.0.0.1:59441:9000"]
    environment:
      MINIO_ROOT_USER: meridian
      MINIO_ROOT_PASSWORD: meridian-fixture-only
  registry:
    image: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
    ports: ["127.0.0.1:55442:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
